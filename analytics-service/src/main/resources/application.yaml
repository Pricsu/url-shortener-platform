spring:
  application:
    name: analytics_service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service-group
  datasource:
    url: jdbc:postgresql://localhost:5435/analyticdb
    username: analyticuser
    password: analyticpass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8084
