spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:userdb}
    username: ${DB_USER:useruser}
    password: ${DB_PASSWORD:userpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-32-chars}
    expiration-ms: 86400000

server:
  port: 8081